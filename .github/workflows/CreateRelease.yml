name: Build and Release

# The version comes from the git tag through MinVer (see Directory.Build.props).
# A commit with a tag v1.2.3 (or v1.2.3-rc.1) is built and released; any other commit is only built.
#
# Pushing a commit and its tag together fires two push events (one per ref), so GitHub always starts
# two runs. They share one concurrency group per commit: the later run cancels the earlier one, and
# the surviving run looks for the release tag on the commit itself, not on the triggering ref.
on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Native AOT for win-x64 must be compiled on Windows (MSVC linker).
    runs-on: windows-latest
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer needs the full history and tags; a shallow clone gives 0.0.0-preview.
          fetch-depth: 0

      - name: Find release tag
        id: release
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish Webp2Png/Webp2Png.csproj -c Release -r win-x64 -p:PublishAot=true

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Webp2Png
          path: Webp2Png/bin/Release/net11.0-windows/win-x64/publish/Webp2Png.exe

      - name: Create GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Webp2Png ${{ steps.release.outputs.tag }}
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          generate_release_notes: true
          files: Webp2Png/bin/Release/net11.0-windows/win-x64/publish/Webp2Png.exe
